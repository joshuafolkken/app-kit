# app-kit's SvelteKit lefthook preset: kit's framework-agnostic base.yml plus the
# SvelteKit-only delta. Owned by app-kit (kit base + delta, no fork). Consumers extend this
# via `node_modules/@joshuafolkken/app-kit/lefthook/sveltekit.yml`.
#
# Two non-obvious lefthook facts (verified against lefthook 1.10.x via `lefthook dump`) shape
# this file:
#   1. Nested `extends` paths resolve from the CONSUMER git root, not from this file — so base
#      is referenced by its root-relative node_modules path, never `./base.yml` (which silently
#      fails to merge and drops every base hook). See joshuafolkken/kit#629.
#   2. On a command-name collision the EXTENDED file (base) wins over the extender. So the
#      SvelteKit commands use distinct `*-svelte` names: they ADD svelte coverage ALONGSIDE
#      base's commands rather than trying (and failing) to override them.
#
# Globs: base's `cspell`/`prettier`/`eslint` already cover every non-svelte type with the SAME
# tool, so the `*-svelte` siblings only need `*.svelte` — base + sibling union = full coverage.
# `type-check` is the exception: base runs `tsc --noEmit` (which cannot see `.svelte` files),
# whereas SvelteKit needs `svelte-check`. Its run line delegates to `pnpm josh-app check:ci` —
# the single source of the sync+check command (app-kit#78): consumers resolve the installed
# `josh-app` bin, app-kit itself resolves its own `josh-app` package script (pnpm falls back
# from script to .bin). So `type-check-svelte` keeps the original preset's wide
# trigger (`*.{svelte,ts,js,mjs,cjs}`) so `svelte-check` still runs when a `.ts`/`.js` change
# breaks a `.svelte` consumer — base's `tsc` co-runs on those (redundant, and a brief
# `.svelte-kit/tsconfig.json` sync/read overlap is possible). Removing base's `tsc` for SvelteKit
# consumers needs the kit-level fix tracked in joshuafolkken/kit#629.
extends:
  - node_modules/@joshuafolkken/kit/lefthook/base.yml

pre-commit:
  commands:
    cspell-svelte:
      glob: '*.svelte'
      run: pnpm exec cspell lint --no-must-find-files --no-progress {staged_files}

    prettier-svelte:
      glob: '*.svelte'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    eslint-svelte:
      glob: '*.svelte'
      run: pnpm exec eslint --quiet --cache --cache-strategy content {staged_files}

    type-check-svelte:
      glob: '*.{svelte,ts,js,mjs,cjs}'
      run: pnpm josh-app check:ci

pre-push:
  commands:
    test-e2e:
      glob: '{*.{svelte,ts,js,mjs,cjs},package.json}'
      env:
        CI: '1'
        PLAYWRIGHT_HTML_OPEN: never
      run: pnpm josh test:e2e

    # Dynamic baseline security scan (build + boot preview + OWASP ZAP). On `pre-push`, never
    # `pre-commit`: it costs ~45s (34s scan + 9s build), and putting that on every commit would
    # train contributors into habitual `--no-verify`, which disables every hook including the
    # cheap ones. Same reasoning that already places test-e2e here.
    #
    # The glob is deliberately NARROW. A ZAP *baseline* scan is passive: what it can detect is
    # response headers and cookie attributes, nothing else. Those come from the files below —
    # a change to a component or a lib function cannot alter the verdict, so a wide
    # `*.{svelte,ts}` trigger would spend 45s per push at zero detection value, which is how
    # hooks get bypassed. CI (.github/workflows/dast.yml) still runs it unconditionally on every
    # PR, so narrowing here costs no coverage.
    #
    # `+server.ts` / `+*.server.ts` are included on purpose: they are the only place a route can
    # emit its own headers or `Set-Cookie`, so dropping them would let an HttpOnly/SameSite gap
    # reach CI unnoticed.
    #
    # `package.json` and `pnpm-lock.yaml` are deliberately EXCLUDED, even though a dependency
    # change (adapter-cloudflare, SvelteKit) can move generated headers. Measured over 40 commits
    # in this repo: package.json changed in 40 of them — `josh bump` rewrites the version on every
    # single change — and pnpm-lock.yaml in 26. Including either would fire the scan on ~every
    # push, which is exactly the always-on cost this narrow glob exists to avoid; the listed files
    # together fire on ~5%. Dependency-driven regressions are CI's job (dast.yml runs
    # unconditionally on every PR, in a clean environment with a frozen lockfile), which is where
    # you want a dependency bump validated anyway.
    #
    # Third non-obvious lefthook fact (probed against 1.10.10, see the two at the top of this
    # file): a glob is matched against the file's FULL repo-relative path, not its basename.
    # `'hooks.server.ts'` matches nothing — it must be `'src/hooks.server.ts'` — while `'**/'`
    # prefixed patterns do match nested paths. Getting this wrong disables the gate SILENTLY:
    # the hook reports "no matching files" and the push succeeds, which is indistinguishable
    # from a clean scan. Any edit here must be re-probed, not assumed.
    #
    # Requires a running Docker daemon; a missing one fails the push loudly rather than skipping
    # the check silently (kit#670). Triage findings in zap-baseline.conf.
    dast:
      glob:
        - '_headers'
        - 'zap-baseline.conf'
        - 'wrangler.jsonc'
        - 'svelte.config.js'
        - 'src/hooks.server.ts'
        - '**/+server.ts'
        - '**/+*.server.ts'
      run: pnpm josh-app dast
