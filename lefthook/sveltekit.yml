# app-kit's SvelteKit lefthook preset: kit's framework-agnostic base.yml plus the
# SvelteKit-only delta. Owned by app-kit (kit base + delta, no fork). Consumers extend this
# via `node_modules/@joshuafolkken/app-kit/lefthook/sveltekit.yml`.
#
# Two non-obvious lefthook facts (verified against lefthook 1.10.x via `lefthook dump`) shape
# this file:
#   1. Nested `extends` paths resolve from the CONSUMER git root, not from this file — so base
#      is referenced by its root-relative node_modules path, never `./base.yml` (which silently
#      fails to merge and drops every base hook). See joshuafolkken/kit#629.
#   2. On a command-name collision the EXTENDED file (base) wins over the extender. So the
#      SvelteKit commands use distinct `*-svelte` names: they ADD svelte coverage ALONGSIDE
#      base's commands rather than trying (and failing) to override them.
#
# Globs: base's `cspell`/`prettier`/`eslint` already cover every non-svelte type with the SAME
# tool, so the `*-svelte` siblings only need `*.svelte` — base + sibling union = full coverage.
# `type-check` is the exception: base runs `tsc --noEmit` (which cannot see `.svelte` files),
# whereas SvelteKit needs `svelte-check`. Its run line delegates to `pnpm josh-app check:ci` —
# the single source of the sync+check command (app-kit#78): consumers resolve the installed
# `josh-app` bin, app-kit itself resolves its own `josh-app` package script (pnpm falls back
# from script to .bin). So `type-check-svelte` keeps the original preset's wide
# trigger (`*.{svelte,ts,js,mjs,cjs}`) so `svelte-check` still runs when a `.ts`/`.js` change
# breaks a `.svelte` consumer — base's `tsc` co-runs on those (redundant, and a brief
# `.svelte-kit/tsconfig.json` sync/read overlap is possible). Removing base's `tsc` for SvelteKit
# consumers needs the kit-level fix tracked in joshuafolkken/kit#629.
extends:
  - node_modules/@joshuafolkken/kit/lefthook/base.yml

pre-commit:
  commands:
    cspell-svelte:
      glob: '*.svelte'
      run: pnpm exec cspell lint --no-must-find-files --no-progress {staged_files}

    prettier-svelte:
      glob: '*.svelte'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    eslint-svelte:
      glob: '*.svelte'
      run: pnpm exec eslint --quiet --cache --cache-strategy content {staged_files}

    type-check-svelte:
      glob: '*.{svelte,ts,js,mjs,cjs}'
      run: pnpm josh-app check:ci

pre-push:
  commands:
    # Unified runtime gate (app-kit#97): ONE command that builds once, boots the preview once, and
    # runs BOTH the Playwright E2E suite and the OWASP ZAP baseline scan against that single server.
    # It replaced the former separate `test-e2e` + `dast` commands, which each built and booted
    # their own preview — duplicate work serially, a port/build collision in parallel. The command
    # owns the server; the two checks are just HTTP clients against it (`josh-app verify`).
    #
    # On `pre-push`, never `pre-commit`: build + boot + E2E + scan is a minutes-long operation, and
    # putting it on every commit would train contributors into habitual `--no-verify`, which
    # disables every hook including the cheap ones.
    #
    # `{push_files}` is passed so `verify` can keep #94's NARROW scan trigger: a ZAP baseline scan
    # is passive (it only sees response headers and cookie attributes), so `verify` runs the ~34s
    # scan ONLY when a header/cookie-affecting file changed (see is_dast_relevant in verify.ts) and
    # skips it otherwise — while E2E always runs. An empty file list is fail-safe → scan (a security
    # check is never skipped silently). CI (.github/workflows/dast.yml) still scans unconditionally
    # on every PR, so this narrowing costs no coverage.
    #
    # The glob is the UNION of the old two: the broad E2E trigger PLUS the narrow DAST files, each
    # pattern verbatim so per-file behavior is unchanged. Header/cookie files (`_headers`,
    # `+server.ts`, `+*.server.ts`, `hooks.server.ts`, `wrangler.jsonc`, `svelte.config.js`,
    # `zap-baseline.conf`) are what can move a verdict; `+server.ts` variants are the only place a
    # route emits its own `Set-Cookie`, so dropping them would let an HttpOnly/SameSite gap through.
    #
    # `package.json` / `pnpm-lock.yaml` stay out of the DAST-relevant set inside verify.ts even
    # though they are in the E2E glob: `josh bump` rewrites package.json on ~every commit, so
    # scanning on it would be the always-on cost #94 removed. Dependency-driven header changes are
    # CI's job (clean env, frozen lockfile).
    #
    # Two non-obvious lefthook facts this relies on (probed against 1.10.10, see the file header):
    # a literal glob matches the file's FULL repo-relative path (so `src/hooks.server.ts`, not
    # `hooks.server.ts`), and `*`/`**` cross `/`. Getting a glob wrong disables the gate SILENTLY
    # ("no matching files" → push succeeds). Any edit here must be re-probed, not assumed.
    #
    # Requires a running Docker daemon WHEN the scan runs (a header/cookie file changed); a missing
    # one fails the push loudly rather than skipping the check (kit#670). Triage in zap-baseline.conf.
    verify:
      glob:
        - '{*.{svelte,ts,js,mjs,cjs},package.json}'
        - '_headers'
        - 'zap-baseline.conf'
        - 'wrangler.jsonc'
        - 'svelte.config.js'
        - 'src/hooks.server.ts'
        - '**/+server.ts'
        - '**/+*.server.ts'
      run: pnpm josh-app verify {push_files}
