# Distributed by @joshuafolkken/app-kit (`josh-app sync` copies this to .github/workflows/load.yml).
#
# Deliberately a SEPARATE workflow file, never an edit to .github/workflows/ci.yml: kit
# single-sources ci.yml and overwrites it on every `josh sync`. Two packages writing one path
# would make the result depend on sync order, silently losing one side's content. app-kit adds
# alongside instead — the same additive rule dast.yml and the lefthook preset follow.
#
# Local edits to this file are overwritten on the next sync. Change the scenario by editing
# k6/load-test.js (yours after the first sync) or open an issue against app-kit (mechanics).
name: Load Test

# Runs MANUALLY (workflow_dispatch), NOT per-PR and NOT on a schedule by default. A load test's
# output is a set of numbers that need interpretation against a baseline, and ephemeral CI runners
# are noisy enough that an uncalibrated scheduled run mostly produces variance — the "decays into
# noise" failure mode. app-kit's repo app is an empty template with no real workload to regress
# against, so the regression-detection value accrues in the CONSUMER's real app, not here. A manual
# run is intentional (you dispatch it when tuning or investigating). Report-only: k6/load-test.js
# defines no failing thresholds, so a run never blocks. See app-kit#95.
#
# To turn this into a periodic regression watch once your app has a real workload AND a calibrated
# baseline, uncomment the `schedule:` block below and tighten k6/load-test.js with thresholds.
on:
  # schedule:
  #   - cron: '0 4 * * 1' # 04:00 UTC every Monday — opt-in; see the note above.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-load:
    name: k6 Load Test
    runs-on: ubuntu-latest
    # Build + boot + a short ramped scenario; the ramp in k6/load-test.js is ~35s.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install pnpm via Corepack (driven by the packageManager pin) instead of
      # pnpm/action-setup: its self-installer crashes on newer pnpm releases with
      # "Cannot use 'in' operator to search for 'integrity' in undefined" (kit#662).
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup safe-chain
        run: pnpm dlx @aikidosec/safe-chain@1.5.1 setup-ci

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare
        run: pnpm prepare

      # k6's official apt repository (GPG-verified with k6's documented signing key). Version-
      # agnostic — always the latest stable — so there is no pin to bump.
      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # One command shared by CI and manual runs — the build / boot / run / teardown mechanics live
      # in app-kit (src/lib/load), not duplicated into every consumer's workflow YAML.
      - name: Run k6 load test
        run: pnpm josh-app load
