# Distributed by @joshuafolkken/app-kit (`josh-app sync` copies this to .github/workflows/dast.yml).
#
# Deliberately a SEPARATE workflow file, never an edit to .github/workflows/ci.yml: kit
# single-sources ci.yml and overwrites it on every `josh sync`. Two packages writing one path
# would make the result depend on sync order, silently losing one side's content. app-kit adds
# alongside instead — the same additive rule the lefthook preset follows.
#
# Local edits to this file are overwritten on the next sync. Change the scan by editing
# zap-baseline.conf (triage) or by opening an issue against app-kit (mechanics).
name: DAST

# Runs on a SCHEDULE (nightly), NOT per-PR. The ZAP baseline needs the full ~2.2 GB zaproxy image,
# which ephemeral runners re-pull on every run — wasteful to pay on every PR, and since this file
# is a distributed default that cost would land on every consumer's CI. The per-PR value (the
# security-header findings this scan actually reports) is already asserted in the Docker-free E2E
# job by `src/routes/security-headers.e2e.ts`, which `josh-app sync` seeds into this project
# alongside this workflow (app-kit#120), so the full scan only needs to run periodically as the broad
# safety net. Run it on demand via the Actions "Run workflow" button (workflow_dispatch) or locally
# with `pnpm josh-app dast`. A failed scheduled run is surfaced by GitHub (email to repo admins +
# red in the Actions tab); it never blocks a PR. See app-kit#103.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The same safe-chain installer pin as ci.yml — the release and its install-safe-chain.sh SHA-256.
# The earlier `pnpm dlx` shim install let the install below run without a scan (app-kit#232).
# workflow-safe-chain.test.ts fails when this pin and ci.yml's drift apart.
env:
  SAFE_CHAIN_INSTALLER_VERSION: 1.5.20
  SAFE_CHAIN_INSTALLER_SHA256: 0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd

jobs:
  zap-baseline:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    # Build + boot + passive scan; the scan itself is spider-bounded, not exhaustive.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          registry-url: 'https://npm.pkg.github.com'

      # kit's shared action, which `josh sync` writes beside ci.yml: the pnpm version, the store
      # cache, the hash-verified safe-chain installer (app-kit#232) and the install, on the same path
      # ci.yml runs (joshuafolkken/kit#3095). workflow-safe-chain.test.ts keeps this file on it.
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        run: pnpm prepare

      # One command shared by CI, the pre-push hook, and manual runs — the scan mechanics live in
      # app-kit, not duplicated into every consumer's workflow YAML.
      - name: Run ZAP baseline scan
        run: pnpm josh-app dast
