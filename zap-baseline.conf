# OWASP ZAP baseline rule configuration, read by `josh-app dast`.
#
# Seeded by @joshuafolkken/app-kit. The Tier-1 rules below are app-kit-owned: `josh-app sync`
# inserts any that are missing (insert-if-absent, never overwriting a line you already have), so a
# stack-universal finding stays triaged once here instead of re-derived in every consumer. Every
# other line — your own reasons, the Tier-2 rules you uncomment, and any Tier-3 rule you add — is
# yours; sync never rewrites it.
#
# Format: one tab-separated rule per line.
#   <rule-id>	<IGNORE|WARN|FAIL>	(<reason>)
#
# Every rule defaults to WARN, and zap-baseline.py exits non-zero when anything is reported, so
# an untriaged finding fails the scan. Silence one only with a recorded reason — an IGNORE with
# no justification is indistinguishable from an unnoticed vulnerability six months later.
#
# Rule ids are printed in the scan output (e.g. `WARN-NEW: Content Security Policy (CSP) Header
# Not Set [10038]`). The full list: https://www.zaproxy.org/docs/alerts/
#
# Three tiers classify every finding:
#   Tier 1 — universal: fires for any SvelteKit + Cloudflare-adapter app. Shipped active below and
#            merged into your file on every sync.
#   Tier 2 — conditional-common: fires only when you make a common choice (add a third-party tag).
#            Shipped commented-out; uncomment the one you opted into.
#   Tier 3 — instance-unique: fires from your own content (e.g. a false positive on a bundled SVG).
#            Not shipped by app-kit — add these yourself, below the Tier-2 block.
#
# --- Tier 1 — universal baseline (app-kit-owned; kept in sync) ------------------------------------
#
# 10038 (CSP not set) is NOT listed: kit.csp in svelte.config.js emits a Content-Security-Policy
# header (`script-src 'self'` + a per-request nonce) on SSR pages, so the finding no longer fires.

10055	IGNORE	(Only the "style-src 'unsafe-inline'" sub-alert is accepted — SvelteKit needs it for runtime-injected transition styles and app.html's inline body wrapper. Inline style cannot run JS, so script-src stays locked to 'self' (broaden it only as the documented script-src exception).)
10049	IGNORE	(Cacheable content is intentional — /_app/immutable/* is content-hashed and served with a one-year immutable Cache-Control by the SvelteKit Cloudflare adapter, and no user-specific data is served from these paths.)
10109	IGNORE	(Informational, not a vulnerability — fires when /robots.txt or /sitemap.xml return 404. Add them per project to clear it.)
90004	IGNORE	(Cross-Origin-Embedder-Policy is only required for cross-origin isolation, which a default SvelteKit app does not use. Enabling it would break legitimate third-party embeds with no threat-model benefit.)

# 10055 script-src widening (special case of Tier 2): the rule above accepts style-src only. If you
# add INLINE third-party script (e.g. inline Google Tag Manager), 10055 also fires its "script-src
# 'unsafe-inline'" sub-alert. Prefer the secure default: keep kit.csp's per-request nonce and load
# the tag via that nonce, leaving script-src ['self']. Broaden 10055 to accept script-src
# 'unsafe-inline' ONLY if an inline script is genuinely unavoidable — it weakens the CSP for every
# page, so it is a deliberate, documented exception, never a frictionless escape hatch.
#
# --- Tier 2 — conditional-common (uncomment only the choice you made) -----------------------------
#
# 90003 (Sub-Resource Integrity): fires when you load a third-party CDN script without an
# `integrity="sha384-..."` attribute (e.g. Google Tag Manager, AdSense). Prefer adding the SRI hash;
# uncomment below only if the provider rotates the file and pinning an SRI hash is impractical.
# 90003	IGNORE	(Third-party CDN script (analytics/ads) is loaded without SRI because the provider rotates the file; the risk is accepted for this specific trusted origin.)
#
# 10017 (Cross-Domain JavaScript Source File Inclusion): fires when you include JS from another
# origin — expected once you add a third-party tag. Uncomment if that inclusion is intentional.
# 10017	IGNORE	(Cross-domain JavaScript is an intentional third-party integration (analytics/ads) served from a trusted origin.)
#
# --- Tier 3 — instance-unique (add your own findings below) ---------------------------------------
#
# Example: a Private IP Disclosure (rule 2) false positive whose matched string is SVG <path>
# coordinate data in a bundled icon. The matched content differs per repo, so app-kit cannot ship
# it — record yours here with the reason.
#
# --- app-kit-only ---
# Triage below applies to app-kit's own demo app and is NOT distributed to consumers (nothing below
# this marker is seeded or merged). Keep every stack-universal rule ABOVE this line so the overlay
# propagates it; put only demo-instance-specific rules here.
# Currently none — app-kit's demo triage is fully covered by the distributable baseline above. The
# script-src half of 10055 stays locked to 'self', drift-guarded by config-presets.test.ts.
