# OWASP ZAP baseline rule configuration, read by `josh-app dast`.
#
# Seeded once by @joshuafolkken/app-kit, then owned by this project — `josh-app sync` never
# overwrites it, because the triage decisions below are yours.
#
# Format: one tab-separated rule per line.
#   <rule-id>	<IGNORE|WARN|FAIL>	(<reason>)
#
# Every rule defaults to WARN, and zap-baseline.py exits non-zero when anything is reported, so
# an untriaged finding fails the scan. Silence one only with a recorded reason — an IGNORE with
# no justification is indistinguishable from an unnoticed vulnerability six months later.
#
# Rule ids are printed in the scan output (e.g. `WARN-NEW: Content Security Policy (CSP) Header
# Not Set [10038]`). The full list: https://www.zaproxy.org/docs/alerts/
#
# --- app-kit's own triage -----------------------------------------------------------------
#
# These three are informational or by-design, not gaps. The genuine header gaps ZAP found
# (10020 anti-clickjacking, 10021 nosniff, 10063 Permissions-Policy) were FIXED in `_headers`
# rather than silenced here.
#
# 10038 (CSP not set) was RESOLVED in #96 by configuring kit.csp in svelte.config.js — SvelteKit now
# emits a `Content-Security-Policy` header (`script-src 'self'` + a per-request nonce) on SSR pages,
# so the finding no longer fires and no IGNORE is needed for it.
#
# 10055 (a CSP-quality rule) fires only its "style-src unsafe-inline" sub-alert. `style-src
# 'unsafe-inline'` is REQUIRED for a SvelteKit default: Svelte transitions inject inline <style> at
# runtime and app.html ships an inline body-wrapper style, so a stricter style-src white-screens any
# consumer that uses a transition (the SvelteKit docs mandate this). Inline STYLE cannot execute JS —
# this relaxes the STYLE surface only. The dangerous 10055 sub-alerts (script-src unsafe-inline,
# wildcard) are NOT accepted here: they are guarded by a unit test on svelte.config.js
# (config-presets.test.ts) that asserts script-src stays exactly ['self'] with no wildcard.

10055	IGNORE	(Only the "style-src unsafe-inline" sub-alert fires; required by SvelteKit for transitions and the app.html body wrapper. Inline style cannot run JS; script-src stays locked and is drift-guarded by a unit test.)
10049	IGNORE	(Cacheable content is intentional: /_app/immutable/* is content-hashed and served with a one-year immutable Cache-Control by the SvelteKit adapter. No user-specific data is served from these paths.)
10109	IGNORE	(Informational ZAP note, not a vulnerability: it fires because /robots.txt and /sitemap.xml return 404 on this template app. Consumers add them per project.)
90004	IGNORE	(Cross-Origin-Embedder-Policy is only required for cross-origin isolation, which this app does not use. Enabling it would break legitimate third-party embeds without any threat-model benefit here.)
