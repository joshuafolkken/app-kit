sonar.projectKey=joshuafolkken_app-kit
sonar.organization=joshuafolkken

# Pure JavaScript files only
sonar.lang.patterns.js=**/*.js,**/*.jsx,**/*.cjs,**/*.mjs
# TypeScript files including .svelte and .vue (which often use TypeScript)
sonar.lang.patterns.ts=**/*.ts,**/*.tsx,**/*.cts,**/*.mts,**/*.vue,**/*.svelte
# Exclude .svelte from CSS patterns
sonar.lang.patterns.css=**/*.css,**/*.less,**/*.scss,**/*.sass

# Disable coverage checks
sonar.coverage.exclusions=**/*

# Exclude upstream-synced bootstrap scripts and dev/CI tooling from analysis.
# .claude/ hosts setup shell scripts synced from joshuafolkken/tasks (must not drift).
# scripts/ hosts git / issue / overrides / telegram workflow tooling — not production code.
# templates/ holds app-shell seeds copied verbatim into consumer scaffolds (e.g.
# app.html, whose <title> is injected via SvelteKit %sveltekit.head%) — distributed
# files, not app-kit source to be quality-gated.
sonar.exclusions=.claude/**,scripts/**,templates/**

# Suppress "OS command from PATH" hotspots (S4036) on dev/CLI tooling.
# scripts/ is already fully excluded above; scripts-ai/ stays analyzed but invokes
# pnpm/git/gh/node via PATH by design, so S4036 is a known false-positive class there.
#
# Suppress "Add a <title> tag" (Web:PageWithoutTitleCheck) on src/app.html — the
# SvelteKit app shell intentionally omits <title>; per-page titles are set via
# <svelte:head> in route components, so this rule is a known false positive here.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e9,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts-ai/**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts-ai/**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e5.resourceKey=src/app.html

# Files to exclude from the duplicate check
sonar.cpd.exclusions=**/*.test.ts,**/*.e2e.ts

# Use SonarCloud-compatible tsconfig
sonar.typescript.tsconfigPath=tsconfig.sonar.json

sonar.issue.ignore.multicriteria.e9.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.e9.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.e6.resourceKey=scripts-ai/**/*
sonar.issue.ignore.multicriteria.e7.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e7.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e8.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e8.resourceKey=scripts-ai/**/*
