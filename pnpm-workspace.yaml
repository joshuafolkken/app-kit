allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  workerd: true
  '@joshuafolkken/kit': false # project postinstall handles lefthook install

# Skip the install-time supply-chain re-verification of the already-committed, reviewed lockfile.
# pnpm 11.5 pairs `minimum-release-age` with a pre-install metadata re-fetch; on clean CI boxes
# (e.g. Cloudflare Workers Builds) it can't authenticate private @joshuafolkken/* GitHub Packages,
# producing a false ERR_PNPM_TARBALL_URL_MISMATCH. minimum-release-age still applies at resolution
# time, so age protection is preserved — only the per-install re-check of a trusted lockfile is skipped.
trustLockfile: true

# Security fixes often require same-day vite releases; minimumReleaseAge below would block them.
# `@types/node` and `tsx` are also excluded so routine Dependabot-style bumps are not
# delayed by the minimum-release-age window.
minimumReleaseAgeExclude:
  - vite
  - '@types/node'
  - tsx
  - '@joshuafolkken/kit'

# Held until #247: SvelteKit 3 / adapter-cloudflare 8 leave the 7.2.9 patch below unused, and
# ERR_PNPM_UNUSED_PATCH then fails `josh latest` outright. `josh latest` skips overridden packages,
# so these two stay on their current majors; the adapter is exact because its patch is (#260).
overrides:
  cookie: 0.7.2
  devalue: ^5.8.1
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/adapter-cloudflare': 7.2.9
  # Security floors for exact pins in latest upstream releases (#265); drop each once upstream moves.
  # GHSA-rj75-hqrm-r3gf: @tailwindcss/typography 0.5.20 pins postcss-selector-parser 6.0.10.
  '@tailwindcss/typography>postcss-selector-parser': ^7.1.6
  # GHSA-wq5f-xc86-pv6w: miniflare (via wrangler) pins sharp 0.35.4.
  'miniflare>sharp': ^0.35.5

patchedDependencies:
  '@sveltejs/adapter-cloudflare@7.2.9': patches/@sveltejs__adapter-cloudflare@7.2.9.patch

minimumReleaseAge: 1440
engineStrict: true
